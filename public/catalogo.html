<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Catálogo | TiendaUT</title>
</head>
<body>
    <img src="logo.png" alt="Logo de TiendaUT">
    <h1>Catálogo</h1>
    <p>Carrito: <span data-testid="contador-carrito">0</span> productos</p>
    <input placeholder="Buscar producto" id="buscar">
    <button id="vaciar">Vaciar carrito</button>
    <ul id="lista"><li>Cargando...</li></ul>
    <script>
        let carrito = 0;
        const lista = document.getElementById('lista');
        const contador = document.querySelector('[data-testid="contador-carrito"]');
        const buscar = document.getElementById('buscar');
        let productos = [];

        function pintar(filtro = '') {
            lista.innerHTML = '';
            productos
                .filter(p => p.nombre.toLowerCase().includes(filtro.toLowerCase()))
                .forEach(p => {
                    const li = document.createElement('li');
                    li.dataset.testid = 'producto';
                    li.innerHTML = `<h2>${p.nombre}</h2><span>$${p.precio}</span><button>Agregar al carrito</button>`;
                    li.querySelector('button').addEventListener('click', () => {
                        carrito++;
                        contador.textContent = carrito;
                    });
                    lista.appendChild(li);
                });
        }

        buscar.addEventListener('input', (e) => {
            pintar(e.target.value);
        });

        document.getElementById('vaciar').addEventListener('click', () => {
            carrito = 0;
            contador.textContent = carrito;
        });

        fetch('/api/productos')
            .then(r => {
                if (!r.ok) throw new Error('Error en API');
                return r.json();
            })
            .then(data => { 
                productos = data; 
                pintar(buscar.value); 
            })
            .catch(() => {
                lista.innerHTML = '<p>No pudimos cargar los productos</p>';
            });
    </script>
</body>
</html>
